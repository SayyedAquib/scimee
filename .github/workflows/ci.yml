name: SCIMEE Production CI Health Check

on:
  push:
    branches: [ "**" ]
  pull_request:
    branches: [ "**" ]

jobs:
  build-and-verify:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run ESLint Health Check (Catch Missing Imports & Syntax Errors)
        run: npm run lint

      - name: Verify Code Formatting (Prettier Check)
        run: npm run check-format

      - name: Verify Production Build
        run: npm run build
